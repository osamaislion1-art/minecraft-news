<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شبكة أخبار ماين كرافت | Osama is Lion</title>
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(22, 27, 34, 0.75);
            --border-color: rgba(56, 189, 248, 0.2);
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, #0f172a 0%, var(--bg-color) 100%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.8;
        }

        header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        main {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 2rem;
        }

        h1 {
            color: var(--accent-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Osama is Lion 🦁</div>
    </header>

    <main>
        <div class="card">
            <h1>شبكة أخبار ماين كرافت</h1>
            <p>أهلاً بك في الموقع الرسمي لأحدث أخبار ماين كرافت والسيرفرات الحصرية.</p>
        </div>
    </main>

    <footer>
        <p>جميع الحقوق محفوظة © 2026 Osama is Lion 🇵🇸</p>
    </footer>

</body>
</html>
